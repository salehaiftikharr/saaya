# Local development services. The server and web apps run on the host during
# development; Postgres is the only required container. Host port 5433 avoids
# colliding with any existing local Postgres on 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: saaya
      POSTGRES_PASSWORD: saaya
      POSTGRES_DB: saaya
    ports:
      - "5433:5432"
    volumes:
      - saaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saaya -d saaya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saaya_pgdata:
