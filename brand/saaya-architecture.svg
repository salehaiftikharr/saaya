<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-label="Three doors, one coworker: web, Slack, and MCP reach the same Saaya harness; jobs run as checkpointed LangGraph graphs whose gated commands pause for the owner; everything durable lives in Postgres as checkpoints, ledger, memory, and artifacts.">
  <title>The Saaya architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#8a8f98" stroke-width="1.4"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#5a50bf" stroke-width="1.6"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#1b1d22">

    <!-- The three doors -->
    <g>
      <rect x="40" y="60" width="150" height="52" rx="10" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="115" y="91" text-anchor="middle">Web</text>
      <rect x="40" y="150" width="150" height="52" rx="10" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="115" y="181" text-anchor="middle">Slack</text>
      <rect x="40" y="240" width="150" height="52" rx="10" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="115" y="271" text-anchor="middle">MCP clients</text>
      <text x="115" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">distinct threads,</text>
      <text x="115" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">one memory</text>
    </g>

    <line x1="190" y1="86" x2="292" y2="146" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="190" y1="176" x2="292" y2="176" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="190" y1="266" x2="292" y2="206" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- The coworker -->
    <g>
      <rect x="300" y="60" width="420" height="240" rx="14" fill="none" stroke="#1b1d22" stroke-width="1.7"/>
      <circle cx="345" cy="102" r="13" fill="#5a50bf" opacity="0.9"/>
      <circle cx="337" cy="94" r="13" fill="#1b1d22"/>
      <text x="372" y="104" font-weight="600" font-size="17">saaya</text>
      <text x="372" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">one FastAPI process</text>

      <rect x="324" y="146" width="176" height="54" rx="10" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="412" y="169" text-anchor="middle">Deep Agents</text>
      <text x="412" y="188" text-anchor="middle" font-size="12.5" fill="#8a8f98">chat and job steps</text>

      <rect x="520" y="146" width="176" height="54" rx="10" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="608" y="169" text-anchor="middle">Job runner</text>
      <text x="608" y="188" text-anchor="middle" font-size="12.5" fill="#8a8f98">LangGraph, budgets</text>

      <text x="332" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">schedules fire ordinary jobs</text>
      <text x="332" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">heartbeat quiet when nothing settled</text>
    </g>

    <!-- The approval gate: the one arrow that matters -->
    <g>
      <path d="M 608 200 L 608 264 L 640 264" fill="none" stroke="#5a50bf" stroke-width="1.7" marker-end="url(#arrowAccent)"/>
      <rect x="644" y="240" width="180" height="48" rx="10" fill="none" stroke="#5a50bf" stroke-width="1.7"/>
      <text x="734" y="261" text-anchor="middle" fill="#5a50bf" font-weight="600" font-size="14.5">gated command</text>
      <text x="734" y="279" text-anchor="middle" fill="#5a50bf" font-size="12.5">pauses for you</text>
      <path d="M 734 288 C 734 330, 640 336, 613 306" fill="none" stroke="#5a50bf" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
      <text x="748" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5a50bf">your decision resumes it,</text>
      <text x="748" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5a50bf">enforced in code</text>
    </g>

    <!-- Durable state -->
    <g>
      <rect x="850" y="88" width="190" height="184" rx="14" fill="none" stroke="#d0d4da" stroke-width="1.4"/>
      <text x="945" y="120" text-anchor="middle" font-weight="600">Postgres</text>
      <text x="945" y="148" text-anchor="middle" font-size="13.5" fill="#4b5563">checkpoints</text>
      <text x="945" y="170" text-anchor="middle" font-size="13.5" fill="#4b5563">event ledger</text>
      <text x="945" y="192" text-anchor="middle" font-size="13.5" fill="#4b5563">memory + provenance</text>
      <text x="945" y="214" text-anchor="middle" font-size="13.5" fill="#4b5563">artifacts</text>
      <text x="945" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">append-only,</text>
      <text x="945" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">survives restarts</text>
    </g>

    <line x1="720" y1="150" x2="842" y2="150" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="781" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8a8f98">every event</text>

    <!-- Recovery note -->
    <text x="540" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8a8f98">kill the process mid-step: the next boot resumes from the checkpoint and the ledger shows the seam</text>
  </g>
</svg>
