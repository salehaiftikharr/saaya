# Development runs only postgres (host port 5433 avoids a local 5432
# collision); `--profile full` also builds and runs the server and web
# containers as the deployable stack.
services:
  server:
    profiles: ["full"]
    build: ./server
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://saaya:saaya@postgres:5432/saaya
      WORKSPACE_DIR: /app/workspace
    volumes:
      - ./workspace:/app/workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ./web
      args:
        SAAYA_API_URL: http://server:8000
    ports:
      - "3000:3000"
    depends_on:
      - server

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: saaya
      POSTGRES_PASSWORD: saaya
      POSTGRES_DB: saaya
    ports:
      - "5433:5432"
    volumes:
      - saaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saaya -d saaya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saaya_pgdata:
